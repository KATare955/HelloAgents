# =============================================================================
# Qwen3-14B 汽车销售 Agent — LoRA SFT 训练配置（LLaMA-Factory）— D1/R2 v02 版
# 对应 D1 决策：960/40、2 epochs、全局 batch 4、nothink 单格式、message 级 loss
#
# 启动（AutoDL，单卡 A800-80GB，per_device 1 × grad_accum 4 = 全局 batch 4）：
#   cd /root/autodl-tmp/LLaMA-Factory
#   llamafactory-cli train /root/autodl-tmp/HelloAgents/eval/sft_data/autodl/qwen3_14b_lora_sft.yaml
#
# ⚠️ 上机前置（A2 扩展点部署，本 yaml 依赖）：
#   1. 复制 HelloAgents/eval/sft_data/v02_gen/lf_extensions.py
#      → src/llamafactory/data/lf_extensions.py
#   2. src/llamafactory/data/__init__.py 末尾加一行：
#        from .lf_extensions import *  # noqa: F401  (注册 qwen3_semantic_pair / v02_react)
#   3. src/llamafactory/data/processor/supervised.py 段数校验放宽（0.9.3 第 93/136 行）：
#        if (len(...) % 2 != 1 or ...) and not isinstance(self.template, SemanticPairTemplate):
# ⚠️ 所有路径均在数据盘 /root/autodl-tmp（系统盘 /root 仅 30GB）
# =============================================================================

### model
# 必须与 Base 评测用的是同一个底座，SFT = Base + LoRA，三阶段才严格可比
# ✅ 已确认：ModelScope 下载于数据盘 /root/autodl-tmp/models/Qwen3-14B（非系统盘 /root/models）
model_name_or_path: /root/autodl-tmp/models/Qwen3-14B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all              # 对所有线性层加 LoRA（Qwen3 推荐）

### dataset
# dataset_dir 指向 v02 转换产物目录（dataset_info.json + sft_train.json + sft_val.json）
dataset_dir: /root/autodl-tmp/HelloAgents/eval/sft_data/v02_gen/llamafactory_v02
dataset: sales_agent_v02_train
eval_dataset: sales_agent_v02_val
# v02 自定义模板（语义配对 + message 级 loss，见头部部署说明）；官方 qwen3 管线
# 无法表达桶 2 "编造轮无 gpt 收尾"形态（converter 拦截 + encode_multiturn IndexError）
template: qwen3_semantic_pair
# 关键排雷点：我们的数据用 ReActAgent 的 Thought 工具（function_call）承载推理，
# 不含 Qwen3 原生 <think> CoT，故关闭思考模式；训练/推理/评测三处必须一致！
enable_thinking: false
cutoff_len: 8192              # v02 实测（SemanticPairTemplate 渲染）train max~2008 / val max~1469，8192 零截断留足余量
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen3-14b-sales/lora/sft_v02
logging_steps: 5
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4   # 单卡 × 1 × 4 = 全局 batch 4（对齐 D1 决策 batch 4）
learning_rate: 1.0e-4
num_train_epochs: 2.0          # D1 决策：960/4 = 240 步/epoch × 2 epochs = 480 步
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true     # 省显存，14B 长序列必备
# 排雷：默认 sdpa（零编译，A800 上足够）。若已装 flash-attn 且要提速，改成 fa2。
flash_attn: sdpa

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
